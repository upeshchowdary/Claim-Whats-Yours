# Alembic configuration for Claim What's Yours.
# The database URL is NOT set here. alembic/env.py reads DATABASE_URL through
# claim_whats_yours.core.config.get_settings().database_url.

[alembic]
script_location = alembic
prepend_sys_path = src
# sqlalchemy.url is intentionally empty; env.py supplies it from settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

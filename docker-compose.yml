version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: claim_whats_yours_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: claim_whats_yours
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claim_whats_yours_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/claim_whats_yours
      ADMIN_API_TOKEN: dev-admin-token-123
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      GROQ_ENABLED: "false"
      DATA_GOV_IN_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claim_whats_yours_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
